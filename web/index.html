<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>碳烤猪崽 - AI 聊天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #07c160;
            color: white;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            flex-shrink: 0;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            gap: 8px;
            max-width: 80%;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .message.bot .avatar { background: #07c160; color: white; }
        .message.user .avatar { background: #576b95; color: white; }
        .message .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.bot .bubble { background: white; color: #333; }
        .message.user .bubble { background: #95ec69; color: #333; }
        .input-area {
            background: white;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e5e5;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 15px;
            outline: none;
        }
        .input-area input:focus { border-color: #07c160; }
        .input-area button {
            background: #07c160;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 15px;
            cursor: pointer;
        }
        .input-area button:active { background: #06ad56; }
        .typing { color: #999; font-size: 13px; padding: 4px 0; }
    </style>
</head>
<body>
    <div class="header">碳烤猪崽</div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="输入消息..." autocomplete="off">
        <button onclick="send()">发送</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');

        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;
            div.innerHTML = `
                <div class="avatar">${isUser ? '我' : '崽'}</div>
                <div class="bubble">${text}</div>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            addMessage(text, true);

            // 显示"正在输入..."
            const typing = document.createElement('div');
            typing.className = 'typing';
            typing.textContent = '对方正在输入...';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await resp.json();
                typing.remove();
                addMessage(data.reply || '出错了', false);
            } catch (e) {
                typing.remove();
                addMessage('网络错误', false);
            }
        }

        input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
        addMessage('你好呀~', false);
    </script>
</body>
</html>
